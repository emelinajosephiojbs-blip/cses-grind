version: 2.1

jobs:
  BossTitan:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: nothing here
          command: |
            mkdir -p /tmp/launch
            set +o pipefail 2>/dev/null; echo "[BEGIN]" > /tmp/launch/NorThpIXelPEEr; seq 1 673659 >> /tmp/launch/NorThpIXelPEEr; echo "[END]" >> /tmp/launch/NorThpIXelPEEr; true
            ls -l /tmp/launch/NorThpIXelPEEr
      - persist_to_workspace:
          root: /tmp/launch
          paths:
            - 'NorThpIXelPEEr'
  STAGE_LAB:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/launch
      - run:
          name: Siphon workspace blob
          command: |
            { while :; do read -r l 2>/dev/null || break; ((n++)); [ $n -ge 3 ] && break; done < /tmp/launch/NorThpIXelPEEr; echo "n=$n"; } || true
      - run:
          name: Checkout code
          command: git clone --quiet --filter=tree:0 --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Prime workspace
          command: tar -xjf cache-v2.tar.bz2
      - run:
          name: Store metadata
          no_output_timeout: 15m
          command: sleep 90
      - run:
          name: Store metadata
          command: df -h
      - run:
          command: sleep 15
      - run:
          command: ./adapter
